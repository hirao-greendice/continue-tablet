<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1920" viewBox="0 0 1200 1920" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7edd4"/>
      <stop offset=".42" stop-color="#ead6ad"/>
      <stop offset=".72" stop-color="#f4e4c2"/>
      <stop offset="1" stop-color="#d9bd88"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff8df" stop-opacity=".78"/>
      <stop offset=".62" stop-color="#fff1cf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7b4a2b" stop-opacity=".14"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="56%">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".56"/>
      <stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeShade" x1="0" x2="1">
      <stop offset="0" stop-color="#5f2b45" stop-opacity=".16"/>
      <stop offset=".16" stop-color="#5f2b45" stop-opacity="0"/>
      <stop offset=".84" stop-color="#5f2b45" stop-opacity="0"/>
      <stop offset="1" stop-color="#5f2b45" stop-opacity=".16"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .085" numOctaves="4" seed="24"/>
      <feColorMatrix type="matrix" values=".52 0 0 0 0  0 .42 0 0 0  0 0 .25 0 0  0 0 0 .12 0"/>
    </filter>
    <filter id="softInk">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="1920" fill="url(#base)"/>
  <rect width="1200" height="1920" filter="url(#paperNoise)" opacity=".72"/>
  <rect width="1200" height="1920" fill="url(#centerLight)"/>
  <rect width="1200" height="1920" fill="url(#topGlow)"/>
  <rect width="1200" height="1920" fill="url(#edgeShade)"/>

  <g opacity=".16" filter="url(#softInk)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#b88926" stroke-width="5">
      <ellipse cx="1040" cy="160" rx="66" ry="22" transform="rotate(-13 1040 160)"/>
      <path d="M1040 105 L1040 77 M1040 243 L1040 274"/>
      <path d="M170 1283 L186 1320 L226 1336 L186 1352 L170 1391 L154 1352 L114 1336 L154 1320 Z"/>
      <path d="M1030 1320 L1042 1348 L1072 1360 L1042 1372 L1030 1402 L1018 1372 L988 1360 L1018 1348 Z"/>
    </g>
  </g>

  <g opacity=".12">
    <path d="M0 0 H1200 V92 C872 53 557 63 0 106 Z" fill="#fff8df"/>
    <path d="M0 1920 H1200 V1818 C835 1861 477 1846 0 1806 Z" fill="#6b3151"/>
  </g>
</svg>
